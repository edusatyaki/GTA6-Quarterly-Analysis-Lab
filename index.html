<html lang="en">
<head>
<meta charset="utf-8">

<body data-chapter="as03">
<div id="app">
  <header class="top">
    <button class="menu" id="menu" type="button" aria-controls="outline" aria-expanded="false">☰ Outline</button>
    <a class="brand" href="index.html">
      <span class="vi" aria-hidden="true">VI</span>
      <span><b>Vice City Data Lab</b><small>GTA VI quarterly analysis · MongoDB in the mongosh shell</small></span>
    </a>
    <div class="prog" aria-live="polite"><span id="progText"></span><div class="bar"><i id="progBar"></i></div></div>
    <button class="fsbtn" id="fs" type="button">⛶ Full screen</button>
  </header>

  <div class="frame">
    <nav class="outline" id="outline" aria-label="Course outline"></nav>
    <div class="work">
      <main class="panes">
        <section class="q" id="q" aria-live="polite"></section>
        <section class="right">
          <div class="shell" id="shell">
            <div class="shbar"><span class="live"></span><span class="t">MONGOSH</span><span class="conn" id="conn"></span><button id="clr" type="button">Clear</button></div>
            <div class="out" id="out"></div>
            <div class="inrow"><span class="pr" id="prompt"></span><textarea id="cmd" rows="1" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="mongosh input"></textarea></div>
          </div>
          <div class="data" id="data">
            <div class="dhead"><b>Data</b><span class="crumbs" id="dcrumb"></span><span class="chips" id="dchips"></span><span class="sp"></span><button class="mini" id="dsBtn" type="button">{ } Dataset code</button><button class="mini" id="dtog" type="button">Hide</button></div>
            <div class="dbody" id="dbody"></div>
          </div>
        </section>
      </main>
      <footer class="bot">
        <button class="nav" id="prev" type="button">← Previous</button>
        <span class="crumb" id="crumb"></span>
        <span class="credit"><b>Innovation in Education</b><i>·</i>Satyaki Das</span>
        <span class="hint">Enter runs · Shift+Enter new line · ↑↓ history</span>
        <button class="nav" id="next" type="button">Next →</button>
      </footer>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>
</div>
